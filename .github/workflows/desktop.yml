name: Desktop appka

# Okno hubu jako samostatná aplikace (desktop/, Electron). Na každém systému se
# appka postaví a dvakrát projde zkouškou desktop/test/smoke.mjs — vývojová
# a pak zabalená — se skutečným hubem z repa. Instalačky zůstanou jako
# artefakty běhu. Ručně: Actions → Desktop appka → Run workflow.
on:
  workflow_dispatch:
  push:
    # Jen větve: u tagů GitHub filtr paths nevyhodnocuje a běh (3 systémy,
    # ~25 min, instalačky jako artefakty) by se pouštěl s každým vydáním.
    branches: ['**']
    paths:
      - 'desktop/**'
      - 'claude-hub.py'
      - '.github/workflows/desktop.yml'

jobs:
  appka:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    env:
      HUB_PYTHON: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Knihovny pro okno bez displeje (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -yq xvfb libgbm1 libnss3 libasound2 libgtk-3-0

      - name: pywinpty — terminál ve Windows (jako install.ps1)
        if: runner.os == 'Windows'
        run: python -m pip install --disable-pip-version-check pywinpty

      - name: Závislosti
        run: npm ci

      - name: Zkouška — vývojová appka
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a npm test; else npm test; fi

      - name: Sestavit instalačky
        run: |
          npm run ikony
          case "$RUNNER_OS" in
            macOS)   npx electron-builder --mac --arm64 --x64 --publish never ;;
            Windows) npx electron-builder --win --x64 --publish never ;;
            Linux)   npx electron-builder --linux --x64 --publish never ;;
          esac

      - name: Zkouška — zabalená appka
        run: |
          case "$RUNNER_OS" in
            macOS)   export HUB_DESKTOP_EXE="$PWD/dist/mac-arm64/Claude Code Hub.app/Contents/MacOS/Claude Code Hub" ;;
            Windows) export HUB_DESKTOP_EXE="$PWD/dist/win-unpacked/Claude Code Hub.exe" ;;
            Linux)   export HUB_DESKTOP_EXE="$PWD/dist/linux-unpacked/claude-code-hub" ;;
          esac
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a npm test; else npm test; fi

      # Intel Mac: zabalená x64 appka přes Rosettu na Apple Silicon stroji.
      - name: Zkouška — zabalená appka pro Intel Mac (Rosetta)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          HUB_DESKTOP_EXE="$PWD/dist/mac/Claude Code Hub.app/Contents/MacOS/Claude Code Hub" npm test

      - uses: actions/upload-artifact@v4
        with:
          name: claude-code-hub-desktop-${{ runner.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.AppImage
          if-no-files-found: error

<?xml version="1.0" encoding="UTF-8"?>
<!-- Paluba — logo se jménem. Značka + text, na tmavém i světlém
     podkladu (barvy jsou z palety aplikace, pozadí je průhledné). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" height="200">
  <style>
    /* Jeden soubor pro obojí: text se řídí motivem toho, kdo se dívá.
       Výchozí je tmavý text pro světlý podklad (README na GitHubu, tisk). */
    .name { fill: #1f2328; }
    @media (prefers-color-scheme: dark) { .name { fill: #e6edf3; } }
  </style>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2129"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0a259"/>
      <stop offset="1" stop-color="#d9702a"/>
    </linearGradient>
  </defs>

  <!-- značka (stejná jako hub-mark.svg) -->
  <g transform="translate(20,20) scale(0.625)">
    <rect width="256" height="256" rx="56" fill="url(#tile)"/>
    <rect x="1.5" y="1.5" width="253" height="253" rx="54.5"
          fill="none" stroke="#e0843c" stroke-opacity=".28" stroke-width="3"/>
    <path d="M96 52 L160 108 L96 164" fill="none" stroke="url(#amber)"
          stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M96 52 V164" stroke="#e8893f" stroke-width="8"
          stroke-linecap="round" opacity=".45"/>
    <path d="M48 182 H208 L192 206 Q188 212 180 212 H76 Q68 212 64 206 Z"
          fill="url(#amber)"/>
  </g>

  <!-- jméno -->
  <text x="214" y="128" font-family="Inter, 'DejaVu Sans', system-ui, sans-serif"
        font-size="84" font-weight="700" class="name" letter-spacing="-1.5">Paluba</text>
  <!-- kurzor pod jménem, ať text navazuje na trup lodi -->
  <rect x="218" y="146" width="64" height="12" rx="6" fill="url(#amber)"/>
</svg>
